# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: alvaro8317udemy
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: first-project
# "service" is the name of this project. This will also be added to your AWS resource names.
service: second-project-with-express

stages:
  default:
    params:
      tableName: "users-table-${sls:stage}"

provider:
  name: aws
  runtime: nodejs20.x
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [UsersTable, Arn]
  environment:
    USERS_TABLE: ${param:tableName}

functions:
  api:
    handler: handler.handler
    events:
      - httpApi: "*"

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions: # Los atributos que se usarán para las llaves (primarias - partición, compuestas) y también los atributos que se usan en índices
          - AttributeName: userId
            AttributeType: S # S - string, N - numeros, B - binarios
        KeySchema: # Que tipo de llave es cada atributo
          - AttributeName: userId
            KeyType: HASH # HASH o RANGE, HASH hace referencia a una llave de partición, RANGE hace referencia a una llave de ordenación
        BillingMode: PAY_PER_REQUEST
        TableName: ${param:tableName}
